    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ADD8E6", "id": "answer_structured", "label": "answer_structured", "shape": "box", "title": null}, {"color": "#90EE90", "id": "StructuredQueryEvent", "label": "StructuredQueryEvent", "shape": "ellipse", "title": null}, {"color": "#FFA07A", "id": "StopEvent", "label": "StopEvent", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "reformulate_query", "label": "reformulate_query", "shape": "box", "title": null}, {"color": "#90EE90", "id": "RetryEvent", "label": "RetryEvent", "shape": "ellipse", "title": null}, {"color": "#90EE90", "id": "QueryValidatedEvent", "label": "QueryValidatedEvent", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "rerank_nodes", "label": "rerank_nodes", "shape": "box", "title": null}, {"color": "#90EE90", "id": "NodesRetrievedEvent", "label": "NodesRetrievedEvent", "shape": "ellipse", "title": null}, {"color": "#90EE90", "id": "NodesRerankedEvent", "label": "NodesRerankedEvent", "shape": "ellipse", "title": null}, {"color": "#ADD8E6", "id": "route_query_step", "label": "route_query_step", "shape": "box", "title": null}, {"color": "#ADD8E6", "id": "synthesize", "label": "synthesize", "shape": "box", "title": null}, {"color": "#ADD8E6", "id": "validate_query", "label": "validate_query", "shape": "box", "title": null}, {"color": "#E27AFF", "id": "StartEvent", "label": "StartEvent", "shape": "ellipse", "title": null}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "answer_structured", "to": "StopEvent"}, {"arrows": "to", "from": "StructuredQueryEvent", "to": "answer_structured"}, {"arrows": "to", "from": "reformulate_query", "to": "QueryValidatedEvent"}, {"arrows": "to", "from": "RetryEvent", "to": "reformulate_query"}, {"arrows": "to", "from": "rerank_nodes", "to": "NodesRerankedEvent"}, {"arrows": "to", "from": "rerank_nodes", "to": "RetryEvent"}, {"arrows": "to", "from": "rerank_nodes", "to": "StopEvent"}, {"arrows": "to", "from": "NodesRetrievedEvent", "to": "rerank_nodes"}, {"arrows": "to", "from": "route_query_step", "to": "NodesRetrievedEvent"}, {"arrows": "to", "from": "route_query_step", "to": "StructuredQueryEvent"}, {"arrows": "to", "from": "route_query_step", "to": "StopEvent"}, {"arrows": "to", "from": "QueryValidatedEvent", "to": "route_query_step"}, {"arrows": "to", "from": "synthesize", "to": "StopEvent"}, {"arrows": "to", "from": "NodesRerankedEvent", "to": "synthesize"}, {"arrows": "to", "from": "validate_query", "to": "QueryValidatedEvent"}, {"arrows": "to", "from": "validate_query", "to": "StopEvent"}, {"arrows": "to", "from": "StartEvent", "to": "validate_query"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
